name: Build and Deploy

on:
  # run if manually triggered
  workflow_dispatch:

  # run if something on the `main` branch changes
  push:
    branches:
      - main

concurrency:
  group: run
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # renovate: datasource=crate depName=cross versioning=semver
  CROSS_VERSION: 0.2.5
  TARGETS: armv7-unknown-linux-musleabihf x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo install cross --vers ${{ env.CROSS_VERSION }}

      - run: |
          for target in ${TARGETS}; do
            cross build --release --target=${target}
            mkdir -p ./dist/${target}/
            cp ./target/${target}/release/segelflug-classifieds ./dist/${target}/segelflug-classifieds
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1